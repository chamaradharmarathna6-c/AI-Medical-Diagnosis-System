<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Login | MedAssist AI</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-message {
      margin: 0.25rem 0 0;
      min-height: 1.4rem;
      color: #bd2937;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }

    .login-message.success {
      color: #1d8a55;
    }

    .password-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }

    .password-toggle input {
      width: auto;
      margin: 0;
    }

    #doctor-login-submit:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>

<body class="auth-page">

  <main class="auth-card" aria-labelledby="doctor-login-title">

    <span class="eyebrow">HEALTHCARE PROFESSIONAL PORTAL</span>

    <h1 id="doctor-login-title">Doctor Login</h1>

    <p>
      Sign in to MedAssist AI to review preliminary
      decision-support assessments.
    </p>

    <form id="doctor-login-form">

      <label>
        Email
        <input
          id="doctor-email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="doctor@email.com"
          required
        >
      </label>

      <label>
        Password
        <input
          id="doctor-password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >
      </label>

      <label class="password-toggle">
        <input id="show-password" type="checkbox">
        <span>Show password</span>
      </label>

      <button id="doctor-login-submit" type="submit">
        Doctor Login
      </button>

      <p
        id="doctor-login-message"
        class="login-message"
        role="alert"
        aria-live="polite"
      ></p>

    </form>

  </main>

  <script>
    (() => {

      const apiBase = "http://127.0.0.1:8000";

      const form = document.querySelector("#doctor-login-form");
      const message = document.querySelector("#doctor-login-message");
      const submit = document.querySelector("#doctor-login-submit");
      const password = document.querySelector("#doctor-password");
      const showPassword = document.querySelector("#show-password");

      showPassword.addEventListener("change", event => {
        password.type = event.currentTarget.checked
          ? "text"
          : "password";
      });


      function showMessage(text, type = "error") {

        message.textContent = text;

        message.classList.remove("success");

        if (type === "success") {
          message.classList.add("success");
        }
      }


      form.querySelectorAll("input").forEach(input => {

        input.addEventListener("input", () => {
          message.textContent = "";
          message.classList.remove("success");
        });

      });


      form.addEventListener("submit", async event => {

        event.preventDefault();

        showMessage("");

        if (!form.reportValidity()) {
          return;
        }

        submit.disabled = true;
        submit.textContent = "Signing in…";

        const email = document.querySelector("#doctor-email").value.trim();
        const passwordValue = document.querySelector("#doctor-password").value;

        try {

          const response = await fetch(
            `${apiBase}/api/auth/doctor-login`,
            {
              method: "POST",

              headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                email: email,
                password: passwordValue
              })
            }
          );


          const body = await response.json().catch(() => null);


        
          if (!response.ok) {

            if (response.status === 401) {

              showMessage(
                "Invalid doctor email or password."
              );

              return;
            }


            if (response.status === 403) {

              showMessage(
                body?.detail ||
                "Doctor access is not permitted."
              );

              return;
            }


            if (response.status === 422) {

              showMessage(
                "Please provide a valid email address and password."
              );

              return;
            }


            showMessage(
              body?.detail ||
              `Unable to sign in. Server returned ${response.status}.`
            );

            return;
          }


          if (
            !body ||
            body.role !== "Doctor" ||
            !body.access_token
          ) {

            showMessage(
              "This account is not authorized for the Doctor Portal."
            );

            return;
          }


          localStorage.setItem(
            "doctorToken",
            body.access_token
          );

          localStorage.setItem(
            "doctorUser",
            JSON.stringify({
              name: body.name,
              email: body.email,
              role: body.role
            })
          );


          showMessage(
            "Login successful. Opening Doctor Portal…",
            "success"
          );


          setTimeout(() => {
            window.location.href = "doctor-dashboard.html";
          }, 300);


        } catch (error) {

         
          if (error instanceof TypeError) {

            showMessage(
              "Unable to connect to the API server. Start FastAPI at http://127.0.0.1:8000."
            );

          } else {

            showMessage(
              error.message ||
              "Doctor login failed."
            );

          }

        } finally {

          submit.disabled = false;
          submit.textContent = "Doctor Login";

        }

      });

    })();
  </script>

</body>
</html>
